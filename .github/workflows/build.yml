# SPDX-License-Identifier: GPL-3.0-only
name: Build, test and release

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run strict C89 and sanitizer tests
        run: make test

  dos-build:
    name: DOS build and integration tests
    # Fork PRs receive host tests; trusted pushes always compile/test DOS.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, nightwatch-dos]
    timeout-minutes: 30
    env:
      DOS_TOOLCHAIN: ${{ vars.DOS_TOOLCHAIN || '/opt/dos-toolchain' }}
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check runner dependencies
        shell: bash
        run: |
          for command in bash make cc python3 dosbox dosbox-x mformat mcopy rg; do
            command -v "$command" >/dev/null || { echo "Missing runner dependency: $command" >&2; exit 1; }
          done
          python3 -c 'from PIL import Image'
          for file in TC/TCC.EXE TC/MAKE.EXE TASM/TASM.EXE; do
            test -f "$DOS_TOOLCHAIN/$file" || { echo "Missing toolchain file: $DOS_TOOLCHAIN/$file" >&2; exit 1; }
          done
          test -d "$DOS_TOOLCHAIN/TC/INCLUDE"
          test -d "$DOS_TOOLCHAIN/TC/LIB"
      - name: Clean and compile the 8088 executable
        run: |
          make clean
          make build
      - name: Test real DOS filesystem calls
        run: make test-dos
      - name: Test all displays and production BIOS input
        run: make test-video
      - name: Check rendering work on the 8086 core
        run: make benchmark
      - name: Package executable, version and licenses
        run: make package
      - name: Upload tested DOS package
        uses: actions/upload-artifact@v4
        with:
          name: nightwatch-dos-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dos-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/**/*.LOG
            build/**/*.log
            build/**/*.POS
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [host-tests, dos-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightwatch-dos-${{ github.sha }}
          path: dist
      - name: Verify version matches the release tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < dist/VERSION.TXT)
          test "$TAG" = "$version" || { echo "Tag $TAG does not match package $version" >&2; exit 1; }
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Nightwatch $TAG"
          fi
