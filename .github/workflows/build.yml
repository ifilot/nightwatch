# SPDX-License-Identifier: GPL-3.0-only
name: Build, test and release

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer branch/PR revision replaces its older run. Release tags finish fully.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  host-tests:
    name: Host regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install host test dependencies
        run: python3 -m pip install Pillow
      - name: Run strict C89 and sanitizer tests
        run: make test

  dos-build:
    name: Build shared DOS executables
    # Pull requests receive host tests; pushes and manual runs test DOS.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/dos-environment
      - name: Clean and compile the 8088 executable
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build bash -c 'make clean && make build'
      - name: Compile shared scripted navigator and test objects
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/ui_build.py
      - name: Bundle compiled DOS inputs
        run: tar -cf "$RUNNER_TEMP/nightwatch-built.tar" build src/BUILD.H
      - uses: actions/upload-artifact@v4
        with:
          name: nightwatch-built-${{ github.sha }}
          path: ${{ runner.temp }}/nightwatch-built.tar
          if-no-files-found: error
          retention-days: 2
      - name: Keep build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dos-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/**/*.LOG
            build/**/*.log
            build/**/*.MAP
          if-no-files-found: ignore
          retention-days: 7

  dos-tests:
    name: DOS tests (${{ matrix.suite }})
    needs: dos-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [filesystem, zip, progress, video, features, storage, benchmark]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/dos-environment
      - uses: ./.github/actions/dos-inputs
      - name: Test real DOS filesystem calls
        if: matrix.suite == 'filesystem'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build bash tests/dos.sh
      - name: Test ZIP inflation on the 8086 with Windows and Linux archives
        if: matrix.suite == 'zip'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/zip_dos.py
      - name: Test ZIP staging and timestamps on FAT12
        if: matrix.suite == 'zip'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/zip_fat12.py
      - name: Test ARJ methods and staging on the 8086 and FAT12
        if: matrix.suite == 'zip'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/arj_dos.py
      - name: Test archive browsing and member extraction on DOS and 8086
        if: matrix.suite == 'zip'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/browse_dos.py
      - name: Test differential progress dialogs
        if: matrix.suite == 'progress'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/progress.py
      - name: Test all displays and production BIOS input
        if: matrix.suite == 'video'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" --env NW_UI_PREBUILT=1 nightwatch-build python3 tests/video.py
      - name: Test Help in every display mode
        if: matrix.suite == 'features'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/help.py
      - name: Test navigator features and saved settings
        if: matrix.suite == 'features'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/features.py
      - name: Test drive detection and F9 picker in every display mode
        if: matrix.suite == 'features'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" --env NW_UI_PREBUILT=1 nightwatch-build python3 tests/drive_dos.py
      - name: Test persistent demo floppies and SD drive
        if: matrix.suite == 'features'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/demo_dos.py
      - name: Test file-manager usability workflows on FAT and 8086
        if: matrix.suite == 'features'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/workflows_dos.py
      - name: Test storage dialogs and recursive folder creation
        if: matrix.suite == 'storage'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/storage_ui.py
      - name: Test storage integrity on DOS and the 8086
        if: matrix.suite == 'storage'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/storage_dos.py
      - name: Check rendering work on the 8086 core
        if: matrix.suite == 'benchmark'
        run: docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" nightwatch-build python3 tests/benchmark.py new
      - name: Keep suite failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dos-${{ matrix.suite }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/**/*.LOG
            build/**/*.log
            build/**/*.MAP
            build/**/*.POS
            build/workflows/**/*.png
          if-no-files-found: ignore
          retention-days: 7

  dos-package:
    name: Package tested DOS build
    needs: [host-tests, dos-build, dos-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/dos-inputs
      - name: Package tested executable, Quick Menu icon and licenses
        run: python3 tools/package.py
      - name: Upload tested DOS package
        uses: actions/upload-artifact@v4
        with:
          name: nightwatch-dos-${{ github.sha }}
          path: build/dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  pages:
    name: Build and deploy browser emulator
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: dos-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nightwatch-dos-${{ github.sha }}
          path: build/dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache pinned emulator downloads
        uses: actions/cache@v4
        with:
          path: build/site-cache
          key: nightwatch-wasm-8.5.2-v1
      - name: Build static website from tested DOS package
        run: |
          python3 -m pip install Pillow
          python3 tools/build_site.py
      - name: Install browser test dependencies
        run: |
          npm install --prefix build/browser-tools --no-audit --no-fund playwright@1.64.0
          build/browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Test emulator and screenshot gallery
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser-tools/node_modules
        run: node tests/check_site.cjs
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: build/site-check
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [host-tests, dos-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightwatch-dos-${{ github.sha }}
          path: dist
      - name: Verify version matches the release tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < dist/VERSION.TXT)
          test "$TAG" = "$version" || { echo "Tag $TAG does not match package $version" >&2; exit 1; }
      - name: Verify package checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "Nightwatch $TAG"
          fi
